<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4 - Themed Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container padding-container">
        <header class="header margin-vertical">
            <h1>Themed Layout Demo</h1>
            <button id="theme-toggle" class="button-base">Toggle Theme</button>
        </header>
        
        <main class="main-content margin-vertical">
            <section class="card card-shadow">
                <h2 class="card-title heading-font">Card Title</h2>
                <p class="card-text body-font">This is a sample card demonstrating the themed layout with CSS custom properties and mixins.</p>
                <button class="card-button button-base">Click Me</button>
            </section>
            
            <section class="card card-shadow">
                <h2 class="card-title heading-font">Another Card</h2>
                <p class="card-text body-font">This shows how reusable components can be styled consistently across themes.</p>
                <button class="card-button button-base">Action Button</button>
            </section>
        </main>
        
        <footer class="footer body-font">
            <p>&copy; 2023 Themed Layout Experiment</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
